name: Update NPM Resources

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-resources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update NPM resources
        run: |
          set -euo pipefail

          UPDATES=""

          update_package() {
            local npm_package="$1"
            local target_dir="$2"
            local extract_mode="$3"  # "full" or custom path patterns

            echo "========================================="
            echo "Checking: $npm_package -> $target_dir"
            echo "========================================="

            # Get the latest version from NPM
            local latest_version
            latest_version=$(npm view "$npm_package" version 2>/dev/null)
            if [ -z "$latest_version" ]; then
              echo "WARNING: Could not fetch version for $npm_package, skipping."
              return
            fi
            echo "Latest version: $latest_version"

            # Download and extract the package
            local tmp_dir
            tmp_dir=$(mktemp -d)
            cd "$tmp_dir"
            npm pack "$npm_package" > /dev/null 2>&1
            local tarball
            tarball=$(ls *.tgz)
            mkdir -p extracted
            tar -xzf "$tarball" -C extracted
            cd -

            local pkg_dir="$tmp_dir/extracted/package"
            if [ ! -d "$pkg_dir" ]; then
              echo "WARNING: Extracted package directory not found for $npm_package, skipping."
              rm -rf "$tmp_dir"
              return
            fi

            # Clear target directory (keep index.html which is auto-generated by tree workflow)
            mkdir -p "$target_dir"

            if [ "$extract_mode" = "full" ]; then
              # Remove old files except index.html
              find "$target_dir" -mindepth 1 -not -name 'index.html' -exec rm -rf {} + 2>/dev/null || true
              # Copy all package contents
              cp -r "$pkg_dir"/* "$target_dir/"
            else
              # extract_mode contains a custom script/function name
              # Call the custom extraction function
              "$extract_mode" "$pkg_dir" "$target_dir"
            fi

            rm -rf "$tmp_dir"
            echo "Updated $npm_package@$latest_version -> $target_dir"
            UPDATES="${UPDATES}\n- \`${npm_package}\` updated to **${latest_version}** → \`${target_dir}/\`"
          }

          # --- Custom extraction functions ---

          extract_exceljs() {
            local pkg_dir="$1" target_dir="$2"
            cp "$pkg_dir/dist/exceljs.min.js" "$target_dir/exceljs.min.js"
          }

          extract_jszip() {
            local pkg_dir="$1" target_dir="$2"
            cp "$pkg_dir/dist/jszip.min.js" "$target_dir/jszip.min.js"
          }

          extract_libass_wasm() {
            local pkg_dir="$1" target_dir="$2"
            find "$target_dir" -mindepth 1 -not -name 'index.html' -exec rm -rf {} + 2>/dev/null || true
            cp "$pkg_dir/dist/js/"* "$target_dir/"
          }

          extract_libheif() {
            local pkg_dir="$1" target_dir="$2"
            find "$target_dir" -mindepth 1 -not -name 'index.html' -exec rm -rf {} + 2>/dev/null || true
            cp "$pkg_dir/libheif-wasm/"* "$target_dir/"
          }

          extract_pdfjs() {
            local pkg_dir="$1" target_dir="$2"
            find "$target_dir" -mindepth 1 -not -name 'index.html' -exec rm -rf {} + 2>/dev/null || true
            # Copy LICENSE
            cp "$pkg_dir/LICENSE" "$target_dir/" 2>/dev/null || true
            # Copy build directory (core library)
            mkdir -p "$target_dir/build"
            cp "$pkg_dir/build/"*.mjs "$target_dir/build/" 2>/dev/null || true
            cp "$pkg_dir/build/"*.map "$target_dir/build/" 2>/dev/null || true
            # Copy web directory (pdf_viewer component)
            if [ -d "$pkg_dir/web" ]; then
              cp -r "$pkg_dir/web" "$target_dir/"
            fi
            # Copy legacy build for broader browser compatibility
            if [ -d "$pkg_dir/legacy" ]; then
              cp -r "$pkg_dir/legacy" "$target_dir/"
            fi
            # Copy cmaps and standard_fonts for proper PDF rendering
            if [ -d "$pkg_dir/cmaps" ]; then
              cp -r "$pkg_dir/cmaps" "$target_dir/"
            fi
            if [ -d "$pkg_dir/standard_fonts" ]; then
              cp -r "$pkg_dir/standard_fonts" "$target_dir/"
            fi
          }

          # --- Run updates ---

          update_package "docx-preview"        "docxjs"       "full"
          update_package "exceljs"              "exceljs"      "extract_exceljs"
          update_package "jszip"                "jszip"        "extract_jszip"
          update_package "libass-wasm"          "libass-wasm"  "extract_libass_wasm"
          update_package "libheif-js"           "libheif"      "extract_libheif"
          update_package "pdfjs-dist"           "pdf.js"       "extract_pdfjs"
          update_package "@ruffle-rs/ruffle"    "ruffle"       "full"

          # Save update summary for PR body
          printf '%b\n' "$UPDATES" > /tmp/update-summary.txt

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo 'summary<<EOF'
              cat /tmp/update-summary.txt
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No updates found."
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update NPM resources'
          branch: auto-update/npm-resources
          delete-branch: true
          title: 'chore: update NPM resources'
          body: |
            ## Automated NPM Resource Update

            This PR was automatically created by the **Update NPM Resources** workflow.

            ### Updated packages
            ${{ steps.changes.outputs.summary }}

            ---
            _This PR was auto-generated. Please review the changes before merging._
          labels: |
            automated
            dependencies
