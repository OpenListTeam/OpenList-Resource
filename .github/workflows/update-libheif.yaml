name: 'Update: libheif (libheif-js)'

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NPM_PACKAGE: libheif-js
  TARGET_DIR: libheif
  BRANCH_NAME: auto-update/libheif

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest version
        id: fetch
        run: |
          LATEST=$(npm view "$NPM_PACKAGE" version 2>/dev/null)
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest $NPM_PACKAGE version: $LATEST"

      - name: Download and extract package
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cd "$TMP"
          npm pack "$NPM_PACKAGE" > /dev/null 2>&1
          mkdir -p extracted
          tar -xzf *.tgz -C extracted
          cd -
          echo "PKG_DIR=$TMP/extracted/package" >> "$GITHUB_ENV"

      - name: Extract files
        run: |
          set -euo pipefail
          # Replace directory with libheif-wasm/* files (wasm bundle + types)
          find "$TARGET_DIR" -mindepth 1 -not -name 'index.html' -exec rm -rf {} + 2>/dev/null || true
          mkdir -p "$TARGET_DIR"
          cp "$PKG_DIR/libheif-wasm/"* "$TARGET_DIR/"

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update ${{ env.NPM_PACKAGE }} to ${{ steps.fetch.outputs.version }}'
          branch: ${{ env.BRANCH_NAME }}
          delete-branch: true
          title: 'chore: update `${{ env.NPM_PACKAGE }}` to ${{ steps.fetch.outputs.version }}'
          body: |
            ## Automated Update

            | Package | Version | Directory |
            |---------|---------|-----------|
            | `${{ env.NPM_PACKAGE }}` | `${{ steps.fetch.outputs.version }}` | `${{ env.TARGET_DIR }}/` |

            ---
            _Auto-generated by the **Update: libheif** workflow. Please review before merging._
          labels: |
            automated
            dependencies
